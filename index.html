<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>textstring</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:Arial,sans-serif}
    #ui{position:fixed;left:16px;top:16px;z-index:10;background:rgba(255,255,255,.85);padding:10px 12px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
    #textInput{font-size:16px;padding:6px 8px;width:min(42vw,420px)}
    .hint{font-size:12px;color:#666;margin-top:6px}
    canvas{display:block}
  </style>
</head>
<body>
  <div id="ui">
    <input id="textInput" value="textstring" maxlength="32" />
    <div class="hint">Drag letters. Enter to rebuild. Space toggles gravity.</div>
  </div>
  <canvas id="canvas"></canvas>
  <script src="pretext.js"></script>
</body>
</html>
